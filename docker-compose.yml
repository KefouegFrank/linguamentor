# ── LinguaMentor — Docker Compose (Solo-Dev Edition) ────────────────────
# One-box deployment: Postgres 16 + Redis 7 + Node gateway + Python AI service
# All data persists in named volumes.

services:
  # ── Unit A: Node API Gateway ──────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: linguamentor_gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      LM_APP_PORT: 3000
      LM_APP_ENV: ${LM_APP_ENV:-development}
      LM_APP_DEBUG: ${LM_APP_DEBUG:-true}
      LM_REDIS_URL: redis://redis:6379
      LM_AI_SERVICE_URL: http://ai-service:8000
      LM_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      LM_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      LM_FRONTEND_URL: ${LM_FRONTEND_URL:-http://localhost:3001}
    secrets:
      - jwt_public.pem
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Unit B: Python AI Service ─────────────────────────────────────────
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: linguamentor_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      LM_APP_ENV: ${LM_APP_ENV:-development}
      LM_APP_DEBUG: ${LM_APP_DEBUG:-true}
      LM_SERVICE_NAME: ai-service
      LM_DB_HOST: postgres
      LM_DB_PORT: 5432
      LM_DB_NAME: ${LM_DB_NAME:-linguamentor_prod}
      LM_DB_USER: ${LM_DB_USER:-linguamentor_admin}
      LM_DB_PASSWORD: ${LM_DB_PASSWORD:-super_secure_pass_2026}
      LM_REDIS_URL: redis://redis:6379
      LM_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      LM_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      LM_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${LM_JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      LM_JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${LM_JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      LM_OPENAI_API_KEY: ${LM_OPENAI_API_KEY:-}
      LM_ANTHROPIC_API_KEY: ${LM_ANTHROPIC_API_KEY:-}
      LM_GROQ_API_KEY: ${LM_GROQ_API_KEY:-}
      LM_GEMINI_API_KEY: ${LM_GEMINI_API_KEY:-}
      LM_CALIBRATION_VERSION: ${LM_CALIBRATION_VERSION:-v1.0-dev}
      LM_USE_MOCK_PROVIDER: ${LM_USE_MOCK_PROVIDER:-false}
    secrets:
      - jwt_private.pem
      - jwt_public.pem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: linguamentor_postgres
    restart: always
    environment:
      POSTGRES_USER: ${LM_DB_USER:-linguamentor_admin}
      POSTGRES_PASSWORD: ${LM_DB_PASSWORD:-super_secure_pass_2026}
      POSTGRES_DB: ${LM_DB_NAME:-linguamentor_prod}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LM_DB_USER:-linguamentor_admin} -d ${LM_DB_NAME:-linguamentor_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: linguamentor_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# ── Docker secrets (JWT key pair) ──────────────────────────────────────────
# Keys generated by: python scripts/generate_jwt_keys.py
secrets:
  jwt_private.pem:
    file: ./secrets/jwt_private.pem
  jwt_public.pem:
    file: ./secrets/jwt_public.pem

volumes:
  pgdata:
  redisdata:
