version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: linguamentor_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-linguamentor_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-linguamentor_prod}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-linguamentor_admin} -d ${DB_NAME:-linguamentor_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linguamentor_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata: